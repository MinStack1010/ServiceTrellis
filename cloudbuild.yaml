# GitHub main -> Cloud Build -> Artifact Registry -> IAP -> G2 GPU VM.
# This file is at the root of the ServiceTrellis GitHub repository.
# The VM only needs the NVIDIA driver, Docker, gcloud, and NVIDIA Container
# Toolkit. CUDA, PyTorch, TRELLIS.2, and all CUDA extensions are in the image.

steps:
  # o-voxel depends on Eigen, stored as a Git submodule. Cloud Build source
  # checkouts do not guarantee recursive submodules, so initialize it here.
  - id: initialize-submodules
    name: gcr.io/cloud-builders/git
    args: [submodule, update, --init, --recursive]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --tag=${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - id: push-commit
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

  - id: upload-vm-deployer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - scp
      - deploy/vm/deploy-trellis2.sh
      - ${_VM_NAME}:/tmp/deploy-trellis2.sh
      - --project=$PROJECT_ID
      - --zone=${_VM_ZONE}
      - --tunnel-through-iap
      - --quiet

  - id: deploy-on-gpu-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --project=$PROJECT_ID
      - --zone=${_VM_ZONE}
      - --tunnel-through-iap
      - --quiet
      - "--command=sudo install -m 0755 /tmp/deploy-trellis2.sh /usr/local/bin/deploy-trellis2 && sudo /usr/local/bin/deploy-trellis2 ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA ${_HF_SECRET}"

substitutions:
  _AR_LOCATION: northamerica-northeast1
  _REPOSITORY: cloud-run-source-deploy
  _IMAGE: trellis2-api
  _VM_NAME: synode-comfyui-trellis-demo
  _VM_ZONE: us-central1-c
  _HF_SECRET: trellis2-hf-token

images:
  - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
